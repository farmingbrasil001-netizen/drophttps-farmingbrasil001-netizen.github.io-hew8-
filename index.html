<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Video Drop - WebRTC P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar and glow effects */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col">

    <header class="bg-slate-900/80 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Wi-Fi Video Drop</h1>
                <p class="text-xs text-slate-400">Transmissão P2P WebRTC na Rede Local</p>
            </div>
        </div>
        <div id="connectionStatus" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" id="statusDot"></span>
            <span id="statusText">Desconectado</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-4 lg:p-6 gap-6 max-w-7xl mx-auto w-full overflow-hidden">
        
        <!-- Controls & Room Panel -->
        <div class="w-full lg:w-96 flex flex-col gap-6 shrink-0">
            
            <!-- Room Management Box -->
            <div class="glass-panel rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    Gerenciamento de Sala
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Código da Sala</label>
                        <div class="flex gap-2">
                            <input type="text" id="roomCodeInput" placeholder="Ex: sala-123" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                            <button id="btnCreateRoom" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 active:scale-95">Criar</button>
                        </div>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button id="btnJoinRoom" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-2.5 rounded-xl text-sm transition active:scale-95">Entrar na Sala</button>
                        <button id="btnCopyCode" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3.5 py-2.5 rounded-xl text-sm transition active:scale-95" title="Copiar Código">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-4 mt-1">
                    <p class="text-xs text-slate-400 mb-3">Sinalização Local (Modo Manual / Rede Local sem Servidor Central)</p>
                    <div class="space-y-2">
                        <button id="btnGenOffer" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-300 font-medium py-2 rounded-xl text-xs transition">1. Gerar Oferta (Host)</button>
                        <button id="btnGenAnswer" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-violet-300 font-medium py-2 rounded-xl text-xs transition">2. Inserir Oferta & Responder</button>
                    </div>
                </div>
            </div>

            <!-- Stream Media Controls -->
            <div class="glass-panel rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    Controles de Mídia
                </h2>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btnToggleCam" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        Câmera
                    </button>
                    <button id="btnToggleMic" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                        Áudio
                    </button>
                </div>
                <button id="btnShareScreen" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    Compartilhar Tela / Vídeo Arquivo
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col gap-4 h-full">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-h-[400px]">
                
                <!-- Local Video Card -->
                <div class="glass-panel rounded-2xl overflow-hidden flex flex-col relative shadow-2xl border border-slate-800">
                    <div class="absolute top-3 left-3 z-10 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 text-slate-300">
                        Seu Vídeo (Local)
                    </div>
                    <div class="flex-1 bg-slate-900 flex items-center justify-center relative overflow-hidden">
                        <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
                        <div id="localPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-2">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            <span class="text-xs">Câmera desativada</span>
                        </div>
                    </div>
                </div>

                <!-- Remote Video Card -->
                <div class="glass-panel rounded-2xl overflow-hidden flex flex-col relative shadow-2xl border border-slate-800">
                    <div class="absolute top-3 left-3 z-10 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 text-slate-300">
                        Vídeo Remoto (Peer)
                    </div>
                    <div class="flex-1 bg-slate-900 flex items-center justify-center relative overflow-hidden">
                        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                        <div id="remotePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-2">
                            <svg class="w-12 h-12 animate-spin text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            <span class="text-xs">Aguardando conexão com o peer...</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Signal Data Modal / Box -->
            <div id="signalBox" class="glass-panel rounded-2xl p-4 shadow-xl hidden flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-indigo-400" id="signalTitle">Dados SDP de Conexão</span>
                    <button id="btnCloseSignal" class="text-slate-400 hover:text-white text-xs">✕ Fechar</button>
                </div>
                <textarea id="signalText" readonly class="w-full h-24 bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-slate-300 font-mono resize-none focus:outline-none"></textarea>
                <div class="flex gap-2">
                    <button id="btnCopySignal" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-1.5 rounded-lg text-xs transition">Copiar Dados</button>
                    <button id="btnAcceptSignal" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-1.5 rounded-lg text-xs transition">Aplicar Resposta</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        let localStream = null;
        let peerConnection = null;
        let isCamActive = false;
        let isMicActive = false;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const localPlaceholder = document.getElementById('localPlaceholder');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const signalBox = document.getElementById('signalBox');
        const signalText = document.getElementById('signalText');
        const signalTitle = document.getElementById('signalTitle');

        function updateStatus(state, text) {
            statusText.textContent = text;
            statusDot.className = `w-2.5 h-2.5 rounded-full ${state}`;
        }

        async function initLocalStream() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localPlaceholder.classList.add('hidden');
                isCamActive = true;
                isMicActive = true;
                updateStatus('bg-indigo-500', 'Câmera Ativa');
            } catch (err) {
                console.error('Erro ao acessar mídia:', err);
                updateStatus('bg-rose-500', 'Erro na Câmera');
            }
        }

        document.getElementById('btnToggleCam').addEventListener('click', async () => {
            if (!localStream) {
                await initLocalStream();
                return;
            }
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                isCamActive = videoTrack.enabled;
                localPlaceholder.classList.toggle('hidden', isCamActive);
            }
        });

        document.getElementById('btnToggleMic').addEventListener('click', async () => {
            if (!localStream) {
                await initLocalStream();
                return;
            }
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                isMicActive = audioTrack.enabled;
            }
        });

        function createPeerConnection() {
            if (peerConnection) return peerConnection;

            peerConnection = new RTCPeerConnection(configuration);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            peerConnection.ontrack = event => {
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remotePlaceholder.classList.add('hidden');
                    updateStatus('bg-emerald-500', 'Conectado (P2P)');
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') {
                    updateStatus('bg-amber-500', 'Conexão Perdida');
                } else if (peerConnection.iceConnectionState === 'connected') {
                    updateStatus('bg-emerald-500', 'Conectado (P2P)');
                }
            };

            return peerConnection;
        }

        document.getElementById('btnCreateRoom').addEventListener('click', async () => {
            await initLocalStream();
            const pc = createPeerConnection();
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Aguarda ICE candidates recolherem um pouco
            setTimeout(() => {
                signalText.value = JSON.stringify(pc.localDescription);
                signalTitle.textContent = "Oferta SDP Gerada (Copie e envie ao Peer)";
                signalBox.classList.remove('hidden');
                updateStatus('bg-amber-500', 'Aguardando Peer...');
            }, 1000);
        });

        document.getElementById('btnJoinRoom').addEventListener('click', async () => {
            await initLocalStream();
            const pc = createPeerConnection();

            const inputData = prompt("Cole aqui a Oferta SDP recebida do Host:");
            if (!inputData) return;

            try {
                const offerObj = JSON.parse(inputData);
                await pc.setRemoteDescription(new RTCSessionDescription(offerObj));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                setTimeout(() => {
                    signalText.value = JSON.stringify(pc.localDescription);
                    signalTitle.textContent = "Resposta SDP Gerada (Envie de volta ao Host)";
                    signalBox.classList.remove('hidden');
                    updateStatus('bg-amber-500', 'Estabelecendo conexão...');
                }, 1000);
            } catch (err) {
                alert("Dados SDP inválidos!");
                console.error(err);
            }
        });

        document.getElementById('btnAcceptSignal').addEventListener('click', async () => {
            if (!peerConnection) return;
            const inputData = signalText.value;
            try {
                const desc = JSON.parse(inputData);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(desc));
                signalBox.classList.add('hidden');
                updateStatus('bg-emerald-500', 'Conectado com Sucesso!');
            } catch (err) {
                alert("Erro ao aplicar descrição remota.");
                console.error(err);
            }
        });

        document.getElementById('btnCopySignal').addEventListener('click', () => {
            signalText.select();
            document.execCommand('copy');
            alert('Dados copiados para a área de transferência!');
        });

        document.getElementById('btnCloseSignal').addEventListener('click', () => {
            signalBox.classList.add('hidden');
        });

        document.getElementById('btnCopyCode').addEventListener('click', () => {
            const code = roomCodeInput.value || 'sala-padrao';
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = code;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert('Código da sala copiado!');
        });

        document.getElementById('btnShareScreen').addEventListener('click', async () => {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                
                localVideo.srcObject = screenStream;
                localPlaceholder.classList.add('hidden');

                if (peerConnection) {
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(screenTrack);
                    }
                }

                screenTrack.onended = async () => {
                    if (localStream) {
                        localVideo.srcObject = localStream;
                        const videoTrack = localStream.getVideoTracks()[0];
                        if (peerConnection && videoTrack) {
                            const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) sender.replaceTrack(videoTrack);
                        }
                    }
                };
            } catch (err) {
                console.log('Compartilhamento de tela cancelado ou indisponível', err);
            }
        });

        window.onload = () => {
            roomCodeInput.value = 'sala-' + Math.floor(Math.random() * 9000 + 1000);
        };
    </script>
</body>
</html>
